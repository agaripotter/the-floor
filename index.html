  h+=`</div><aside class="pager"><h2>Pager</h2><div class="msgs">${S.pager.slice(0,14).map(m=>`<div class="msg ${m.who==='Dr. Hanan'?'h':''}"><time>${hhmm(m.t)} · ${m.who==='Dr. Hanan'?'<b>Dr. Hanan</b>':esc(m.who)}</time>${m.x}</div>`).join('')}</div></aside></div>`;
  $('#app').innerHTML=h}

function sayHTML(s){return s?`<div class="say"><div class="who">${esc(s[0])}</div><div class="ar" lang="ar" dir="rtl">${tx(s[1])}</div><div class="en">${tx(s[2])}</div></div>`:''}
function triage(id){const p=S.pts.find(x=>x.id===id);S.view='tri';S.cur=p;window.scrollTo(0,0);const v=p.door.v;
  const ab=(c,val)=>`<span class="${c?'ab':''}">${val}</span>`;
  $('#app').innerHTML=`<div class="sheet"><p class="eyebrow">At the door · ${hhmm(S.clock)} · you have thirty seconds</p>
  <h1 style="font-size:2rem">${esc(p.cc)}</h1>
  <p class="look">${p.door.look}</p>
  <div class="chips">${ab(typeof v.hr!=='number'||v.hr>110||v.hr<50,'HR '+v.hr)}${ab(v.bp==='—'||parseInt(v.bp)<100||parseInt(v.bp)>170,'BP '+v.bp)}${ab(typeof v.rr!=='number'||v.rr>22,'RR '+v.rr)}${ab(v.sp<94,'SpO₂ '+v.sp+'%')}${ab(v.t>=38.5,'T '+v.t+'°')}</div>
  ${sayHTML(p.door.say)}
  <div class="q">Which CTAS level?</div>
  <div class="levels" id="lv">${[1,2,3,4,5].map(n=>`<button class="lv" id="lv${n}" onclick="pickT(${n})"><span class="ctas k${n}">${n}</span><b>${CT[n][0]}</b><small>${CT[n][1]}</small></button>`).join('')}</div>
  <div id="after"></div></div>`}
function pickT(n){const p=S.cur;if(p.tri)return;p.tri=n;const d=n-p.ctas;const sc=d===0?2:Math.abs(d)===1?1:0;score('R',sc,2);
  document.querySelectorAll('.lv').forEach(b=>b.disabled=true);$('#lv'+p.ctas).classList.add('right');if(d)$('#lv'+n).classList.add('wrong');
  const tag=d===0?'Correct':d>0?'Under-triaged':'Over-triaged';
  const extra=d>0?` Under-triage is the dangerous direction: it leaves a sick patient in the waiting room.`:d<0?` Over-triage is the safer mistake, but it takes a resus bed and a nurse from someone who needs them.`:'';
  if(d>1)page('Dr. Hanan',`${p.cc}: you called CTAS ${n}, it was a ${p.ctas}. When the vitals are abnormal, believe them.`);
  $('#after').innerHTML=`<div class="fb s${sc}"><div class="tag">${tag} · CTAS ${p.ctas}, ${CT[p.ctas][0].toLowerCase()}</div><div>${p.why}${extra}</div></div>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="endT()">${p.name} goes to ${p.bed} →</button><span class="cost">+2 min</span></div>`;
  $('#after').scrollIntoView({behavior:'smooth',block:'nearest'})}
function endT(){S.cur.state='ready';tick(2);board()}

function openPt(id){const p=S.pts.find(x=>x.id===id);
  if(S.pts.some(x=>x.state==='door')){toast('Triage the new arrival first');return}
  const ready=S.pts.filter(x=>x.state==='ready');
  if(ready.length>1){const best=Math.min(...ready.map(x=>x.ctas));const ok=p.ctas===best;score('P',ok?2:0,2);
    if(!ok){const o=ready.find(x=>x.ctas===best);page('Dr. Hanan',`You went to ${p.name} (CTAS ${p.ctas}) while ${o.name} (CTAS ${o.ctas}) was waiting. Sickest first, always.`)}}
  if(p.seenAt===null)p.seenAt=S.clock;
  enterPt(p)}
function enterPt(p){S.view='enc';S.cur=p;S.step=0;window.scrollTo(0,0);const st=p.stages[p.stage];
  $('#app').innerHTML=`<div class="enc"><div class="side"><div class="pthead"><span class="ctas k${p.ctas}">${p.ctas}</span><div><h2>${p.name}, ${p.age}${p.sex}</h2><div class="sub">${esc(p.cc)} · ${p.bed}</div></div></div>${monHTML()}</div><div class="story" id="story"></div></div>`;
  M.v={};M.ye=null;setMon({rhythm:p.rhythm||'sinus',hr:p.door.v.hr,bp:p.door.v.bp,rr:p.door.v.rr,sp:p.door.v.sp,t:p.door.v.t,noout:false,...(p.lastMon||{})});
  if(typeof p.door.v.hr!=='number')setMon({hr:p.hr});
  if(st.mon)setMon(st.mon);
  $('#mon').classList.toggle('alarm',!!st.code);
  step()}
function step(){const p=S.cur,st=p.stages[p.stage],s=st.steps[S.step];
  if(s.mon)setMon(s.mon);
  const head=`<p class="eyebrow">${p.bed} · ${hhmm(S.clock)}${st.code?' · code running':''}</p>`;
  if(s.t==='cpr')return cprStep(head,s);
  if(s.t==='shock')return shockStep(head,s);
  const key=p.stage+'.'+S.step;const ord=p.order[key]||(p.order[key]=shuffle(s.ch.map((c,i)=>i)));
  $('#story').innerHTML=`${head}<p class="x">${tx(s.x)}</p>${sayHTML(s.say)}<div class="q">${s.q}</div>
  <div class="opts">${ord.map((ci,i)=>`<button class="opt" id="o${ci}" onclick="pick(${ci})"><i>${'ABCD'[i]}</i><span>${tx(s.ch[ci][0])}</span></button>`).join('')}</div>
  <div id="hintbox"><button class="hint" onclick="askM()">Ask Maricel</button></div><div id="after"></div>`;
  $('#story').scrollIntoView({behavior:'smooth',block:'start'})}
function askM(){const s=S.cur.stages[S.cur.stage].steps[S.step];S.asked++;$('#hintbox').innerHTML=`<p class="hintx">Maricel: “${s.hint}”</p>`}
function pick(ci){const p=S.cur,st=p.stages[p.stage],s=st.steps[S.step];const dk=p.stage+'.'+S.step;if(p.ans[dk])return;p.ans[dk]=1;
  const c=s.ch[ci],sc=c[1];score(s.k,sc,2);p.hist.push({sc,take:s.take});
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);$('#o'+ci).classList.add('pick','s'+sc);$('#o0').classList.add('s2');

  const tag=sc===2?'Best move':sc===1?'Reasonable, but not the best':'Risky';
  const han=sc===2?'':`<div class="han"><b>What Dr. Hanan would do:</b> ${tx(s.ch[0][0])}. ${tx(s.ch[0][2])}</div>`;
  $('#after').innerHTML=`<div class="fb s${sc}"><div class="tag">${tag}</div><div>${tx(c[2])}</div>${han}</div>${nextBtn(STEP_MIN)}`;
  $('#hintbox').innerHTML='';$('#after').scrollIntoView({behavior:'smooth',block:'nearest'})}
function nextBtn(min){const p=S.cur,st=p.stages[p.stage],last=S.step===st.steps.length-1;
  return`<div class="row" style="margin-top:14px"><button class="btn" id="nx" onclick="next(${min})">${last?'Finish →':'Continue →'}</button>${min?`<span class="cost">+${min} min</span>`:''}</div>`}
function next(min){const p=S.cur,st=p.stages[p.stage];if(min)tick(min);
  if(S.step<st.steps.length-1){S.step++;step();return}
  p.lastMon={...M.v};delete p.lastMon.noout;if(typeof M.hr==='number')p.hr=M.hr;
  const fin=st.dispo||st.out;
  $('#story').innerHTML=`<p class="eyebrow">${p.bed} · ${hhmm(S.clock)}</p><p class="x">${tx(fin)}</p><div class="row"><button class="btn" onclick="leave()">Back to the floor →</button></div>`;
  $('#mon').classList.remove('alarm')}
function leave(){const p=S.cur,st=p.stages[p.stage];
  if(p.stage<p.stages.length-1){p.stage++;p.state='pend';p.readyAt=S.clock+st.wait;p.waitLabel=st.waitLabel}
  else{p.state='done';p.doneAt=S.clock;if(st.code)page('Dr. Hanan',tx(`I heard the code from the corridor, {DR}. You kept your head. We'll debrief properly at handover.`))}
  tick(0);board()}

/* CPR */
let CPR=null;
function cprStep(head,s){CPR={taps:[],good:0,total:0,n:s.n,done:false};
  $('#story').innerHTML=`${head}<p class="x">${tx(s.x)}</p>
  <div class="cpr"><div class="q" style="text-align:center">Compress at 100–120 a minute</div>
  <button class="push" id="push" onpointerdown="tap(event)">PUSH</button>
  <div class="rate"><span id="rt">—</span><small>/min</small></div>
  <div class="gauge"><div class="zone"></div><div class="pin" id="pin"></div></div>
  <div class="coach" id="coach">Tap the button, or press the space bar, in time with the ring.</div>
  <div class="prog"><b id="pg"></b></div></div><div id="after"></div>`;
  $('#story').scrollIntoView({behavior:'smooth',block:'start'})}
function tap(ev){if(ev)ev.preventDefault();const c=CPR;if(!c||c.done||S.view!=='enc')return;const now=performance.now();c.taps.push(now);M.tap=M.t;tone(90,.09,'sine',.12);
  if(c.taps.length>=3){const rate=120000/(now-c.taps[c.taps.length-3]);c.total++;const ok=rate>=100&&rate<=120;if(ok)c.good++;
    $('#rt').textContent=Math.round(rate);$('#pin').style.left=Math.max(0,Math.min(100,(rate-60)))+'%';
    $('#coach').textContent=ok?'Good. Hold that pace.':rate<100?'Faster.':'Slower. Let the chest recoil.';
    $('#coach').style.color=ok?'var(--good)':'var(--ok)';$('#pg').style.width=Math.min(100,c.good/c.n*100)+'%';
    if(c.good>=c.n||c.total>=c.n*3)cprEnd()}}
function cprEnd(){const c=CPR;c.done=true;const f=c.good/c.total,sc=f>=.7?2:f>=.45?1:0;score('A',sc,2);S.cur.hist.push({sc,take:`CPR: 100–120 compressions a minute, 5–6 cm deep, full recoil, minimal pauses.`});
  $('#push').disabled=true;
  $('#after').innerHTML=`<div class="fb s${sc}"><div class="tag">${Math.round(f*100)}% of compressions in the target zone</div><div>${sc===2?'That is high-quality CPR. Good compressions are the single thing in an arrest that everything else depends on.':sc===1?'Uneven. Most people go too fast under stress. Count out loud, or use the metronome on the defibrillator.':'Well off the target. Too slow and no blood moves; too fast and the heart has no time to refill. Aim for two compressions a second and count out loud.'}</div></div>${nextBtn(2)}`}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&CPR&&!CPR.done&&S.view==='enc'&&document.getElementById('push')){e.preventDefault();if(!e.repeat)tap()}});

/* shock */
function shockStep(head,s){CPR=null;
  $('#story').innerHTML=`${head}<p class="x">${tx(s.x)}</p>
  <div class="cpr"><div class="q">Shock ${s.n} · 200 J biphasic</div><div class="charge" id="chg"><b></b></div>
  <div class="coach" id="coach">Compressions continue while it charges.</div>
  <button class="btn" id="sb" onclick="charge()">Charge</button></div><div id="after"></div>`;
  $('#story').scrollIntoView({behavior:'smooth',block:'start'})}
function charge(){const b=$('#sb');b.disabled=true;$('#chg').classList.add('go');tone(300,1.6,'sawtooth',.03,2200);$('#coach').textContent='Charging…';
  setTimeout(()=>{if(!$('#sb'))return;b.disabled=false;b.textContent='Everyone clear. Shock';b.onclick=shock;$('#coach').textContent='“Oxygen away. Everyone clear. Shocking.”';tone(1500,.5,'square',.03)},1650)}
function shock(){$('#sb').disabled=true;const f=$('#flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');setTimeout(()=>f.classList.remove('on'),600);tone(70,.35,'square',.2);M.flatUntil=M.t+1.3;
  $('#coach').textContent='Shock delivered.';$('#after').innerHTML=nextBtn(0)}

function codeAlarm(p){S.view='code';alarmSound();
  const d=document.createElement('div');d.id='code';d.innerHTML=`<div><p class="eyebrow" style="color:#fff">${hhmm(S.clock)} · overhead page</p><h1>CODE BLUE</h1><p>Resus 1. Abu Khalid. Maricel is shouting your name.</p><button class="btn" onclick="runCode()">Run</button></div>`;
  document.body.appendChild(d)}
function runCode(){const d=$('#code');if(d)d.remove();enterPt(S.pts.find(x=>x.id==='khalid'))}

/* ================= debrief ================= */
function debrief(){S.view='deb';S.over=true;window.scrollTo(0,0);
  let got=0,max=0;for(const k in S.comp){got+=S.comp[k][0];max+=S.comp[k][1]}const pct=Math.round(got/max*100);
  const verdict=pct>=85?'Ready for Sunday.':pct>=70?'Safe, and getting sharper.':pct>=50?'Not yet. Run it again.':'Tonight was hard. That is what tonight is for.';
  const best=+store.get('best')||0;if(pct>best)store.set('best',pct);
  const keys=Object.keys(COMP),R=92,cx=150,cy=120;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)]};
  const val=k=>S.comp[k]&&S.comp[k][1]?S.comp[k][0]/S.comp[k][1]:0;
  const radar=`<svg viewBox="-75 -14 450 262" width="100%" role="img" aria-label="Scores by skill">
  ${[.33,.66,1].map(f=>`<polygon points="${keys.map((k,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('')}
  ${keys.map((k,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="var(--line)"/>`).join('')}
  <polygon points="${keys.map((k,i)=>pt(i,R*Math.max(.06,val(k))).join(',')).join(' ')}" fill="color-mix(in srgb,var(--lamp) 30%,transparent)" stroke="var(--lamp)" stroke-width="2"/>
  ${keys.map((k,i)=>{const[x,y]=pt(i,R+14);return`<text x="${x}" y="${y}" text-anchor="${i===0?'middle':i<3?'start':'end'}" ><tspan x="${x}">${COMP[k]}</tspan><tspan x="${x}" dy="13" style="fill:var(--ink)">${Math.round(val(k)*100)}%</tspan></text>`}).join('')}</svg>`;
  const rows=S.pts.map(p=>{const w=p.seenAt-p.arr,ok=w<=TARGET[p.ctas];
    return`<tr><td><b>${p.name}</b>, ${p.age}<br><span style="color:var(--mute);font-size:.82rem">${esc(p.cc)}</span></td>
    <td class="mono">${p.tri===p.ctas?p.ctas:`${p.tri} <span style="color:var(--bad)">(was ${p.ctas})</span>`}</td>
    <td class="mono" style="color:var(--${ok?'good':'bad'})">${w} min<br><span style="color:var(--mute);font-size:.74rem">target ${TARGET[p.ctas]}</span></td>
    <td class="dots">${p.hist.map(h=>`<i class="d${h.sc}"></i>`).join('')}</td><td style="font-size:.84rem;color:var(--mute)">${esc(p.stages[p.stages.length-1].dispo)}</td></tr>`}).join('');
  const takes=[];S.pts.forEach(p=>p.hist.forEach(h=>{const t=takes.find(x=>x.t===h.take);if(t){if(h.sc<2)t.rev=true}else takes.push({t:h.take,rev:h.sc<2})}));
  takes.sort((a,b)=>b.rev-a.rev);const nrev=takes.filter(t=>t.rev).length;
  $('#app').innerHTML=`<div class="deb"><div style="display:grid;gap:22px;min-width:0">
  <div><p class="eyebrow">03:00 · handover · debrief with Dr. Hanan</p><h1>${verdict}</h1>
  <p class="lede" style="color:var(--mute);margin-top:10px;max-width:40em">${tx(`Eight patients, {DR}, and all eight left your hands with a plan. You asked Maricel for help ${S.asked} time${S.asked===1?'':'s'}${S.asked?'. Keep doing that.':'. On the real floor, ask more. It is a skill, not a weakness.'}`)}</p></div>
  <div class="card tbl"><table><thead><tr><th>Patient</th><th>Your CTAS</th><th>Door to doctor</th><th>Decisions</th><th>Outcome</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.3rem">Your pocket card</h2><button class="btn ghost sm" id="cp" onclick="copyCard()">Copy as text</button></div>
  <p style="color:var(--mute);font-size:.9rem;margin-top:4px">${nrev?`The ${nrev} in bold ${nrev===1?'is the one':'are the ones'} to review before your first real shift.`:'A clean sheet. Carry these with you anyway.'}</p>
  <ul class="pocket" id="pocket">${takes.map(t=>`<li class="${t.rev?'rev':''}">${t.t}</li>`).join('')}</ul></div>
  </div>
  <aside style="display:grid;gap:18px"><div class="card" style="text-align:center"><div class="big">${pct}<span style="font-size:1.4rem">%</span></div><p style="color:var(--mute);font-size:.86rem">${got} of ${max} points${best&&best>=pct?` · your best ${best}%`:''}</p>${radar}</div>
  <button class="btn" onclick="start()">Work the shift again</button>
  <p class="fine" style="margin:0">Choices are reshuffled every shift. Teaching simulation only: have your emergency faculty review doses and “CMC policy” items before use.</p></aside></div>`}
function copyCard(){const t='THE FLOOR — pocket card\n\n'+[...document.querySelectorAll('#pocket li')].map(l=>'• '+l.textContent).join('\n');
  const done=()=>{$('#cp').textContent='Copied'};
  try{navigator.clipboard.writeText(t).then(done,()=>sel())}catch(e){sel()}
  function sel(){const r=document.createRange();r.selectNodeContents($('#pocket'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#cp').textContent='Selected. Press copy'}}

/* boot */
S.name=store.get('name')||'';S.fem=!!store.get('fem');
intro();paintClock();
</script>
